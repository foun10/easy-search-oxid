name: CI

on:
  push:
    branches: [b-7.x]
    tags: ['v*']
  pull_request:
    branches: [b-7.x]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Parsing alone, against every PHP version the module claims to support - and above all
  # against the lowest one.
  #
  # This job exists because of a bug that got all the way to release-readiness: the module
  # declared "php": "^8.1" and carried constants in a trait, which is PHP 8.2. On 8.1 that
  # is a fatal parse error, not a degradation - the module would not have loaded at all on
  # the floor of its own constraint. Nothing caught it, because the test containers run 8.2
  # and the matrix below never installs the floor without a shop that needs it.
  #
  # Cheap and fast, so it runs first and on its own: a syntax error on one PHP version
  # should not be reported as fifteen failing shop installs.
  lint:
    name: Lint on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Parse every file
        run: |
          set -e
          find src tests migration -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

  # Full matrix: every OXID version this branch supports, against every PHP version OXID
  # officially supports for it, minus the ones below this module's floor. The pairs come
  # from _tooling/oxid-php-matrix.md and must stay in sync with the compatibility table in
  # README.md - the table is a promise, this is what keeps it true.
  #
  # OXID 7.0 appears with 8.1 only, although the shop itself also runs on 8.0: the module
  # uses readonly properties throughout, so 8.1 is the floor.
  tests:
    name: OXID ${{ matrix.oxid }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        include:
          - { oxid: '7.0', php: '8.1' }
          - { oxid: '7.1', php: '8.1' }
          - { oxid: '7.1', php: '8.2' }
          - { oxid: '7.2', php: '8.2' }
          - { oxid: '7.2', php: '8.3' }
          - { oxid: '7.3', php: '8.2' }
          - { oxid: '7.3', php: '8.3' }
          - { oxid: '7.3', php: '8.4' }
          - { oxid: '7.4', php: '8.2' }
          - { oxid: '7.4', php: '8.3' }
          - { oxid: '7.4', php: '8.4' }
          - { oxid: '7.5', php: '8.3' }
          - { oxid: '7.5', php: '8.4' }
          - { oxid: '7.5', php: '8.5' }

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: oxid
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Check out the module
        uses: actions/checkout@v4
        with:
          path: module

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, zip, bcmath, soap, mysqli, pdo_mysql
          # Composer is pinned deliberately. From 2.9 on, the advisory policy refuses to
          # install composer/composer 2.8.8, which the OXID 7 metapackage requires - the
          # shop install then fails outright. See _tooling/oxid-6-7-unterschiede.md, 6.
          tools: composer:2.8
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-oxid${{ matrix.oxid }}-php${{ matrix.php }}-${{ hashFiles('module/composer.json') }}
          restore-keys: |
            composer-oxid${{ matrix.oxid }}-php${{ matrix.php }}-
            composer-oxid${{ matrix.oxid }}-

      - name: Prepare the database
        # The service container cannot be given a command line, so the collation our local
        # docker-compose passes as a flag is applied here instead. MySQL 8 would otherwise
        # default to utf8mb4_0900_ai_ci, which is not what the shops are tested against.
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "
            DROP DATABASE IF EXISTS oxid;
            CREATE DATABASE oxid CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;"

      - name: Install OXID ${{ matrix.oxid }}
        run: |
          composer create-project --no-interaction \
            oxid-esales/oxideshop-project shop "dev-b-${{ matrix.oxid }}-ce"

      - name: Set up the shop
        working-directory: shop
        run: |
          ./vendor/bin/oe-console oe:setup:shop \
            --db-host=127.0.0.1 --db-port=3306 \
            --db-name=oxid --db-user=root --db-password=root \
            --shop-url=http://localhost/ \
            --shop-directory="$GITHUB_WORKSPACE/shop/source" \
            --compile-directory="$GITHUB_WORKSPACE/shop/source/tmp" \
            --language=en
          # OXID 7.0 has no oe:theme namespace yet - the command arrived later in the 7.x
          # line. The integration tests render no frontend templates, so a missing theme is
          # harmless; failing the whole job over it would not be.
          ./vendor/bin/oe-console oe:theme:activate apex \
            || echo 'oe:theme:activate unavailable on this OXID version - skipped'

      - name: Install the demo catalogue
        working-directory: shop
        # Without articles the integration tests that read the catalogue skip themselves,
        # and those are the ones that matter most: the bug that made every product with
        # variants unfindable by name (fallstricke Nr. 9) is invisible without real data.
        #
        # oe:setup:demodata refuses to run unless these three tables are empty, and then
        # truncates every table it inserts into - oxuser included, and it ships no admin.
        # Nothing here logs in, so that is fine; it is not fine on a shop somebody uses.
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot oxid -e "
            SET FOREIGN_KEY_CHECKS=0;
            TRUNCATE TABLE oxuser; TRUNCATE TABLE oxarticles; TRUNCATE TABLE oxcategories;
            SET FOREIGN_KEY_CHECKS=1;"
          ./vendor/bin/oe-console oe:setup:demodata --no-interaction
          ./vendor/bin/oe-eshop-db_views_generate

      - name: Install and activate the module
        working-directory: shop
        run: |
          composer config repositories.local path "$GITHUB_WORKSPACE/module"
          composer require foun10/easysearch:@dev --no-interaction
          ./vendor/bin/oe-console oe:module:install "$GITHUB_WORKSPACE/module"
          ./vendor/bin/oe-console oe:module:activate foun10EasySearch

      - name: Create the module's tables
        working-directory: shop
        # The module ships a Doctrine migration; without it every table it reads is missing
        # and the integration suite tests only the error paths.
        run: ./vendor/bin/oe-eshop-doctrine_migration migrations:migrate foun10easysearch --no-interaction

      - name: Build the index
        working-directory: shop
        # The search half of the integration suite needs something to search. This also
        # exercises the indexer against a real catalogue on every supported OXID version,
        # which is where an Enterprise-only table or a reserved word shows up.
        run: ./vendor/bin/oe-console foun10:easysearch:reindex

      - name: Install the module's dev dependencies
        working-directory: module
        # update, not install: there is no committed lock file, because the dependency tree
        # is resolved per PHP version. A lock file would tie the whole matrix to one.
        run: composer update --no-interaction --no-progress

      - name: Unit tests
        working-directory: module
        run: composer tests-unit

      - name: Integration tests
        working-directory: module
        env:
          OXID_SHOP_BOOTSTRAP: ${{ github.workspace }}/shop/source/bootstrap.php
        run: composer tests-integration

      - name: Shop error log
        if: failure()
        run: cat shop/source/log/oxideshop.log || echo "no log written"

  # Mutation testing needs no shop, so it runs once on a fixed PHP version rather than
  # across the matrix. Infection is fetched as a phar on purpose: it needs its own PHP
  # constraints, and as a require-dev entry it would drag the module's dependency tree
  # around with it.
  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Check out the module
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, zip, bcmath, soap, mysqli, pdo_mysql
          # pcov rather than xdebug: coverage only, and considerably faster.
          coverage: pcov
          tools: composer:2.8

      - name: Install dependencies
        run: composer update --no-interaction --no-progress

      - name: Install Infection
        # 0.29.x is the newest line that still runs on PHP 8.2; 0.35 requires 8.3.
        run: |
          curl -sSLo /usr/local/bin/infection \
            https://github.com/infection/infection/releases/download/0.29.14/infection.phar
          chmod +x /usr/local/bin/infection

      - name: Run mutation testing
        # The full run takes about five minutes, which is past Composer's default process
        # timeout - the run is fine, the wrapper gives up.
        env:
          COMPOSER_PROCESS_TIMEOUT: 1200
        run: composer tests-mutation
